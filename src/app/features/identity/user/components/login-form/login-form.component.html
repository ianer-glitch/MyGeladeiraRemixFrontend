<form *transloco="let t; prefix: 'identity.user.login.login-form'" [formGroup]="loginForm">
  <input-text 
    [fluid]="true" 
    [label]="t('email-label')"
    [placeholder]="t('email-placeholder')"
    id="email"
    formControlName="Email" 
  />
  
  <input-password
    [fluid]="true" 
    [label]="t('password-label')"
    [placeholder]="t('password-placeholder')"
    id="senha"
    formControlName="Password"
  
  />
  <confirmation-buttons
    [confirmLabel]="t('confirm-label')"
    (confirmClick)="login()"
    (denyClick)="handleDeny()"
    [denyLabel]="t('deny-label')"
    [isConfirmLoading]="isLoading"
  />
</form>
