<form [formGroup]="loginForm">
  <input-text 
    [fluid]="true" 
    label="Email"
    placeholder="Insira o email"
    id="email"
    formControlName="Email" 
  />
  <input-password
    [fluid]="true" 
    label="Senha"
    placeholder="Insira a senha"
    id="senha"
    formControlName="Password"
  
  />
  <confirmation-buttons
    confirmLabel="Entrar"
    (confirmClick)="login()"
    (denyClick)="handleDeny()"
    denyLabel="Cadastrar"
    [isConfirmLoading]="isLoading"
  />
</form>
