<section *transloco="let t; prefix:translocoPath" class="statistic-manage-container">

  <page-subtitle
    [information]="t('information')"
    infoPosition="left"
  >
    {{t('label')}}
  </page-subtitle>

  <skeleton
   *ngIf="isLoading"
    width="300px"
    height="200px"
  />
  <div>
    <canvas class="graph" #graph ></canvas>
  </div>

</section>
