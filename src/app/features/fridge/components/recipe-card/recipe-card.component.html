<card *transloco="let t; prefix:translocoPath"  [title]="title()">
  <div class="body">
    <h3>{{t('ingredients')}}</h3>
    <ul class="ingredients-list">
      <li *ngFor="let ingre of ingredients()">
        <p>{{ingre}}</p>
      </li>
    </ul>
    <h3>{{t('method')}}</h3>
    <p>{{method()}}</p>
  </div>
    
  
</card>
