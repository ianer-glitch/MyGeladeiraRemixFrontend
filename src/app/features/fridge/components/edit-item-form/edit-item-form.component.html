<div  class="form-container" [ngStyle]="{'background-color':backgroundColor}">
    <form [formGroup]="itemForm">
    <h1>{{itemName}}</h1>
    <img-upload-item
      [fileUrl]="iconLink"
    />

    
    <input-number 
      label="Quantidade mínima"
      [min]="0"
      information="Aqui você vai definir quado o  item será adicionado a lista de compras. Caso a quantidade seja 1, o item aparecerá na lista de compras quando restar 1 unidade."
      formControlName="minimunQuantity"
      />
      <expiration-time-selector
      formControlName="expiration"
      />

    <app-input-number-buttons
      label="Qual a quantidade?"
      formControlName="quantity"
    />
    
    <app-button 
      class="remove-button"
      label="Excluir" 
      severity="danger"
      (click)="handleDangerClick()"
      primeIcon="pi pi-trash"
      [isLoading]="isRemoveLoading"
      />

    <confirmation-buttons
      confirmLabel="Salvar"
      denyLabel="Cancelar"
      (denyClick)="handleDenyClick()"
      (confirmClick)="handleConfirClick()"
       [isConfirmLoading]="isLoading"
      />
  </form>
    
</div>
