<ul >
  <li  *ngFor="let item of fridgeItemsList">
    <item
      [iconLink]="item.iconLink"
      [backgroundColor]="item.color"
      [expirationPercentage]="item.percentageExpired"
      [id]="item.itemId"
      [quantity]="item.quantity"
      (click)="handleClickItem(item)"
      [isEditing]="isMultipleAdd ||isMultipleSub"
    />
  </li>
    
  <li>
    <button-add-item (click)="showPopup = true"/>
  </li> 
</ul>
<div class="comfirm-edit-buttons-container">
  <confirmation-buttons
    class="comfirm-edit-buttons"
    *ngIf="isMultipleAdd ||isMultipleSub "
    confirmLabel="Salvar"
    denyLabel="Cancelar"
    (denyClick)="handleDenyEditing()"
    (confirmClick)="updateMultipleFridgeItemsQuantities()"
  ></confirmation-buttons>
</div>

<popup-add-fridge-item 
  [(ngModel)]="showPopup"
  (close)="handleClose()"
  />
<fridge-speed-dial
  (addClick)="handleAddMultiple()"
  (removeClick)="handleRemoveMultiple()"
  *ngIf="!isMultipleAdd && !isMultipleSub"
/>
