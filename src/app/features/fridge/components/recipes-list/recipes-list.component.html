<ul class="recipe-list-container">
  
  <li *ngFor="let re of recipes">
    <recipe-card
      [title]="re.title"
      [ingredients]="re.ingredients"
      [method]="re.method"
    />
  </li>

  <li *ngIf="isLoading">
    <skeleton
      width="100%"
      height="10rem"
    />
  </li>
  
  <li *ngIf="isLoading">
    <skeleton
      width="100%"
      height="10rem"
    />
  </li>
  
</ul>
