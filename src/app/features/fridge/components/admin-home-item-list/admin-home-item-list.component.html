<ul>
  <li *ngFor="let item of itemsList">
    <item
      [iconLink]="item.icon"
      [backgroundColor]="item.color"
      [iconName]="item.name"
      [id]="item.id"
      (click)="handleClickItem(item)"
    >{{item}}</item>
  </li>
  <li>
    <button-add-item (click)="handleClickAddItem()"/>
  </li>
</ul>
