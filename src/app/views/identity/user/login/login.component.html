<section>
  <static-image 
    name="Logo.svg"
    width="150px"
    height="196px"
    alt="my geladeira logo"
    />
  
  <form>
    <input-text 
      [fluid]="true" 
      label="Email"
      placeholder="Insira o email"
      id="email"
      />
      <input-text 
      [fluid]="true" 
      label="Senha"
      placeholder="Insira a senha"
      id="senha"
      />
      <confirmation-buttons
        confirmLabel="Entrar"
        denyLabel="Cadastrar"
      />
  </form>
</section>
