<fieldset>
  <label  for="{{id}}">
    {{label}} 
    <icon-info 
      *ngIf="information"
      [infoPosition]="informationPosition" 
      [information]="information" 
    />
  </label>
  <p-password
  [placeholder]="placeholder"
  [fluid]="true"
  [ngModel]="text"
  [feedback]="false"
  [toggleMask]="true"
  (ngModelChange)="handleChange($event)"
  />
</fieldset>
