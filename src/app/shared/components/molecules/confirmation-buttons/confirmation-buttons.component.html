<div class="button-container">
	<app-button 
	  severity="secondary" 
	  [label]="denyLabel"
	  (click)="denyClick.emit($event)"
	  [fluid]="true"
		[isLoading]="isDenyLoading"
		[type]="dennyButtonType()"
	/>
	<app-button 
	  severity="primary" 
	  [label]="confirmLabel"
	  (click)="confirmClick.emit($event)"
	  [fluid]="true"
		[isLoading]="isConfirmLoading"
		[type]="confirmButtonType()"
	/>
</div>
