server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ /index.html;
    
    }

    location /identity/ {
        rewrite ^/identity(/.*)$ $1 break;
        proxy_pass http://identity-api-service.my-geladeira-remix.svc.cluster.local:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy API requests for Fridge Service
    location /fridge/ {
        rewrite ^/fridge(/.*)$ $1 break;
        proxy_pass http://fridge-api-service.my-geladeira-remix.svc.cluster.local:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy API requests for Statistic Service
    location /statistic/ {
         rewrite ^/statistic(/.*)$ $1 break;
        proxy_pass http://statistic-api-service.my-geladeira-remix.svc.cluster.local:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    

}